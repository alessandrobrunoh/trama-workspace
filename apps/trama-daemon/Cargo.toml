[package]
name = "trama-daemon"
description = "Local session manager: owns agent processes, survives UI restarts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
trama-domain = { path = "../../crates/trama-domain" }
trama-protocol = { path = "../../crates/trama-protocol" }
trama-infra = { path = "../../crates/trama-infra" }
trama-db = { path = "../../crates/trama-db" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
async-channel = { workspace = true }
base64 = "0.22"
trama-collab-protocol = { path = "../../crates/trama-collab-protocol" }
# Collab client: HTTP/1.1 and WebSocket to a collab service, plain only to
# loopback and TLS (rustls with the `ring` provider, which the workspace
# already builds; system roots via rustls-native-certs) for anything else.
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27.0"
trama-collab = { path = "../trama-collab" }
axum = { version = "0.8", features = ["ws"] }
