[package]
name = "trama-desktop"
description = "TramaWorkspace desktop app (GPUI Kit)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "TramaWorkspace"
path = "src/main.rs"

[dependencies]
trama-domain = { path = "../../crates/trama-domain" }
trama-protocol = { path = "../../crates/trama-protocol" }
serde_json = { workspace = true }
chrono = { workspace = true }
async-channel = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync"] }
gpui-kit = "=0.7.1"
