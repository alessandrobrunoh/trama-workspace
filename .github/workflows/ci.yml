name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Let every run finish: the Windows job is slow and each push should
  # get a full result.
  cancel-in-progress: false

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The whole workspace (core crates, daemon, collab service, GPUI desktop)
  # must build and pass on every desktop OS.
  workspace:
    name: workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep LF line endings in fixtures
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype-dev libfontconfig-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libssl-dev libasound2-dev libzstd-dev pkg-config clang cmake
      - name: Git identity for test fixtures
        run: |
          git config --global user.name "Trama CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace --no-fail-fast
