name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: macOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Channel comes from rust-toolchain.toml (stable).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Note: trama-desktop first build is heavy (GPUI Kit pulls a large
      # native graph; expect a long compile on a cold cache).
      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace
