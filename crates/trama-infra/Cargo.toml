[package]
name = "trama-infra"
description = "Infrastructure adapters: Claude Code stream-json driver, git, runners, MCP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
dunce = "1"
trama-domain = { path = "../trama-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
async-channel = { workspace = true }
tokio = { workspace = true }
ulid = { workspace = true }
# Model providers: streaming chat-completions client (llm/). Same HTTP/TLS
# stack the daemon's collab client already builds (rustls + ring, system roots).
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
